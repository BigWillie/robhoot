<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RobHoot — Play</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join -->
  <div id="join-screen" class="screen active">
    <div class="logo">Rob<span>Hoot</span></div>
    <div class="join-form">
      <input type="tel" id="pin-input" placeholder="Game PIN" maxlength="4" inputmode="numeric" autocomplete="off">
      <input type="text" id="name-input" placeholder="Nickname" maxlength="20" autocomplete="off">
      <div class="emoji-picker" id="emoji-picker">
        <p class="emoji-picker-label">Pick your avatar</p>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <button class="btn" id="join-btn">Join</button>
      <div id="error-box"></div>
    </div>
  </div>

  <!-- Waiting in Lobby -->
  <div id="waiting-screen" class="screen">
    <div class="logo">Rob<span>Hoot</span></div>
    <h2 id="welcome-msg">You're in!</h2>
    <p class="waiting-msg">Waiting for the host to start...</p>
  </div>

  <!-- Question -->
  <div id="question-screen" class="screen">
    <div class="question-counter" id="q-counter"></div>
    <div class="timer" id="timer">--</div>
    <div class="question-text" id="q-text"></div>
    <img id="q-image" class="question-image" hidden>
    <div class="options-grid" id="q-options"></div>
  </div>

  <!-- Answered (waiting for reveal) -->
  <div id="answered-screen" class="screen">
    <h2>Answer locked in!</h2>
    <p class="waiting-msg">Waiting for time to run out...</p>
  </div>

  <!-- Result -->
  <div id="result-screen" class="screen">
    <div id="feedback" class="feedback"></div>
    <div id="points" class="points-display"></div>
    <div id="total-score" class="points-display" style="margin-top:0.5rem;opacity:0.7"></div>
    <p class="waiting-msg">Waiting for next question...</p>
  </div>

  <!-- Host Disconnected -->
  <div id="disconnected-screen" class="screen">
    <div class="logo">Rob<span>Hoot</span></div>
    <h2>Host disconnected</h2>
    <p class="waiting-msg">The host has left the game. Please refresh to join a new one.</p>
    <a class="btn no-underline" href="/play.html">Refresh</a>
  </div>

  <!-- Leaderboard -->
  <div id="leaderboard-screen" class="screen">
    <div class="logo">Rob<span>Hoot</span></div>
    <h1>Final Results</h1>
    <div class="leaderboard-list" id="final-lb"></div>
  </div>

  <script>
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    let ws = null;
    let reconnectAttempts = 0;
    let reconnectTimer = null;
    let intentionalClose = false;

    const $ = id => document.getElementById(id);
    const screens = document.querySelectorAll('.screen');
    const optionColors = ['option-1', 'option-2', 'option-3', 'option-4'];

    // --- Emoji avatar ---
    const EMOJIS = ['🐶','🐱','🐻','🦊','🐸','🐵','🦁','🐼','🐨','🐯','🦄','🐙','🐳','🦋','🐢','🐬','🦜','🐔','🦖','🐲','🍕','🎸','🚀','🌈'];
    let selectedAvatar = null;

    function renderEmojiGrid() {
      $('emoji-grid').innerHTML = EMOJIS.map(e =>
        `<button type="button" class="emoji-option${selectedAvatar === e ? ' selected' : ''}" data-emoji="${e}">${e}</button>`
      ).join('');
      $('emoji-grid').querySelectorAll('.emoji-option').forEach(btn => {
        btn.addEventListener('click', () => {
          $('emoji-grid').querySelectorAll('.emoji-option').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedAvatar = btn.dataset.emoji;
        });
      });
    }
    renderEmojiGrid();

    // --- Session storage helpers ---
    function saveSession(pin, name, avatar) {
      try { sessionStorage.setItem('robhoot', JSON.stringify({ pin, name, avatar })); } catch {}
    }
    function getSession() {
      try { return JSON.parse(sessionStorage.getItem('robhoot')); } catch { return null; }
    }
    function clearSession() {
      try { sessionStorage.removeItem('robhoot'); } catch {}
    }

    function showScreen(id) {
      screens.forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
    }

    function showError(msg) {
      $('error-box').innerHTML = `<div class="error-msg">${esc(msg)}</div>`;
      setTimeout(() => $('error-box').innerHTML = '', 3000);
    }

    // --- Central message handler ---
    function handleMessage(type, data) {
      switch (type) {
        case 'joined':
          reconnectAttempts = 0;
          if (data.avatar) selectedAvatar = data.avatar;
          saveSession($('pin-input').value.trim(), data.name, data.avatar || selectedAvatar);
          showScreen('waiting-screen');
          $('welcome-msg').textContent = `Welcome, ${data.name}!`;
          break;

        case 'rejoined':
          reconnectAttempts = 0;
          $('join-btn').textContent = 'Join';
          applyResync(data);
          break;

        case 'error':
          if ($('join-screen').classList.contains('active')) {
            // If rejoin failed with "Invalid PIN" or "No active game", clear session
            if (data.message === 'Invalid PIN' || data.message === 'No active game to rejoin' || data.message === 'Player not found in this game') {
              clearSession();
              $('join-btn').textContent = 'Join';
            }
            showError(data.message);
            $('join-btn').disabled = false;
          }
          break;

        case 'question':
          showScreen('question-screen');
          $('q-counter').textContent = `Question ${data.index + 1} of ${data.total}`;
          $('timer').textContent = data.timeLimit;
          $('timer').className = 'timer';
          $('q-text').textContent = data.question;
          showImage('q-image', data.image);
          renderOptions(data.options);
          break;

        case 'timer':
          $('timer').textContent = data.remaining;
          if (data.remaining <= 5) {
            $('timer').classList.add('warning');
          }
          break;

        case 'answer-received':
          showScreen('answered-screen');
          break;

        case 'result':
          showScreen('result-screen');
          if (data.yourAnswer === data.correct) {
            $('feedback').textContent = 'Correct!';
            $('feedback').className = 'feedback correct';
            $('points').textContent = `+${data.points.toLocaleString()} pts`;
          } else {
            $('feedback').textContent = data.yourAnswer ? 'Wrong!' : 'No answer';
            $('feedback').className = 'feedback wrong';
            $('points').textContent = '+0 pts';
          }
          $('total-score').textContent = `Total: ${data.totalScore.toLocaleString()}`;
          break;

        case 'leaderboard':
          showScreen('leaderboard-screen');
          renderLeaderboard(data.leaderboard);
          clearSession();
          break;

        case 'host-disconnected':
          showScreen('disconnected-screen');
          intentionalClose = true;
          clearSession();
          break;
      }
    }

    // --- Apply resync payload after rejoin ---
    function applyResync(data) {
      if (data.state === 'question' && !data.alreadyAnswered) {
        showScreen('question-screen');
        const q = data.question;
        $('q-counter').textContent = `Question ${q.index + 1} of ${q.total}`;
        $('timer').textContent = data.timeRemaining;
        $('timer').className = 'timer';
        if (data.timeRemaining <= 5) $('timer').classList.add('warning');
        $('q-text').textContent = q.question;
        showImage('q-image', q.image);
        renderOptions(q.options);
      } else if (data.state === 'question' && data.alreadyAnswered) {
        showScreen('answered-screen');
      } else if (data.state === 'reveal') {
        showScreen('result-screen');
        const r = data.result;
        if (r.yourAnswer === r.correct) {
          $('feedback').textContent = 'Correct!';
          $('feedback').className = 'feedback correct';
          $('points').textContent = `+${r.points.toLocaleString()} pts`;
        } else {
          $('feedback').textContent = r.yourAnswer ? 'Wrong!' : 'No answer';
          $('feedback').className = 'feedback wrong';
          $('points').textContent = '+0 pts';
        }
        $('total-score').textContent = `Total: ${r.totalScore.toLocaleString()}`;
      } else if (data.state === 'leaderboard') {
        showScreen('leaderboard-screen');
        renderLeaderboard(data.leaderboard);
        clearSession();
      }
    }

    // --- Reconnection logic ---
    function attemptRejoin(pin, name, avatar) {
      ws = new WebSocket(`${proto}//${location.host}/ws/play`);
      intentionalClose = false;

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'rejoin', data: { pin, name, avatar } }));
      };

      ws.onmessage = (e) => {
        const { type, data } = JSON.parse(e.data);
        handleMessage(type, data);
      };

      ws.onclose = () => {
        if (intentionalClose) return;
        handleDisconnect();
      };
    }

    function handleDisconnect() {
      const session = getSession();
      if (!session) {
        // No session — just show join screen
        if (!$('join-screen').classList.contains('active') && !$('disconnected-screen').classList.contains('active') && !$('leaderboard-screen').classList.contains('active')) {
          showScreen('join-screen');
          showError('Disconnected from game');
        }
        return;
      }

      // Auto-retry up to 3 times with exponential backoff
      if (reconnectAttempts < 3) {
        const delay = Math.pow(2, reconnectAttempts) * 1000; // 1s, 2s, 4s
        reconnectAttempts++;
        reconnectTimer = setTimeout(() => {
          attemptRejoin(session.pin, session.name, session.avatar);
        }, delay);
      } else {
        // All retries exhausted — show pre-filled join screen with rejoin button
        reconnectAttempts = 0;
        showScreen('join-screen');
        $('pin-input').value = session.pin;
        $('name-input').value = session.name;
        $('join-btn').textContent = 'Rejoin Game';
        $('join-btn').disabled = false;
        showError('Connection lost. Tap Rejoin to reconnect.');
      }
    }

    function connect() {
      ws = new WebSocket(`${proto}//${location.host}/ws/play`);
      intentionalClose = false;

      ws.onopen = () => {};

      ws.onmessage = (e) => {
        const { type, data } = JSON.parse(e.data);
        handleMessage(type, data);
      };

      ws.onclose = () => {
        if (intentionalClose) return;
        handleDisconnect();
      };
    }

    function showImage(id, filename) {
      const img = $(id);
      if (filename) {
        img.src = `/images/${filename}`;
        img.hidden = false;
      } else {
        img.hidden = true;
        img.src = '';
      }
    }

    function renderOptions(options) {
      $('q-options').innerHTML = options.map((opt, i) =>
        `<button class="option-btn ${optionColors[i]}" data-answer="${i + 1}">${esc(opt)}</button>`
      ).join('');

      $('q-options').querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          $('q-options').querySelectorAll('.option-btn').forEach(b => {
            b.disabled = true;
          });
          btn.classList.add('selected');
          ws.send(JSON.stringify({ type: 'answer', data: { answer: parseInt(btn.dataset.answer) } }));
        });
      });
    }

    function renderLeaderboard(lb) {
      $('final-lb').innerHTML = lb.map((p, i) =>
        `<div class="leaderboard-row">
          <div class="leaderboard-rank">${i + 1}</div>
          <div class="leaderboard-avatar">${p.avatar || ''}</div>
          <div class="leaderboard-name">${esc(p.name)}</div>
          <div class="leaderboard-score">${p.score.toLocaleString()}</div>
        </div>`
      ).join('');
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Join handler
    $('join-btn').addEventListener('click', () => {
      const pin = $('pin-input').value.trim();
      const name = $('name-input').value.trim();
      if (!pin || !name) {
        showError('Enter PIN and nickname');
        return;
      }
      $('join-btn').disabled = true;

      // Pick a random avatar if none selected
      const avatar = selectedAvatar || EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      selectedAvatar = avatar;

      // Determine if this is a rejoin (button says "Rejoin Game" or session matches)
      const session = getSession();
      const isRejoin = session && session.pin === pin && session.name.toLowerCase() === name.toLowerCase();
      const msgType = isRejoin ? 'rejoin' : 'join';

      if (!ws || ws.readyState !== WebSocket.OPEN) {
        ws = new WebSocket(`${proto}//${location.host}/ws/play`);
        intentionalClose = false;

        ws.onopen = () => {
          ws.send(JSON.stringify({ type: msgType, data: { pin, name, avatar } }));
        };

        ws.onmessage = (e) => {
          const { type, data } = JSON.parse(e.data);
          handleMessage(type, data);
        };

        ws.onclose = () => {
          if (intentionalClose) return;
          handleDisconnect();
        };
      } else {
        ws.send(JSON.stringify({ type: msgType, data: { pin, name, avatar } }));
      }
    });

    // Allow Enter key to submit
    $('pin-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('name-input').focus();
    });
    $('name-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') $('join-btn').click();
    });

    // Allow 1-4 keys to select answers
    document.addEventListener('keydown', (e) => {
      const num = parseInt(e.key);
      if (num >= 1 && num <= 4) {
        const btn = $('q-options').querySelector(`.option-btn[data-answer="${num}"]`);
        if (btn && !btn.disabled) btn.click();
      }
    });

    // Auto-fill PIN from QR code URL
    const urlPin = new URLSearchParams(location.search).get('pin');
    if (urlPin) {
      document.getElementById('pin-input').value = urlPin;
    }

    // On load: check for existing session and try auto-rejoin, otherwise just connect
    const savedSession = getSession();
    if (savedSession) {
      $('pin-input').value = savedSession.pin;
      $('name-input').value = savedSession.name;
      if (savedSession.avatar) {
        selectedAvatar = savedSession.avatar;
        renderEmojiGrid();
      }
      $('join-btn').textContent = 'Rejoin Game';
      attemptRejoin(savedSession.pin, savedSession.name, savedSession.avatar);
    } else {
      connect();
    }
  </script>
</body>
</html>
